name: Stack smoke

# Starts every service of the demo (core, Kafka group, observability stack) on a
# GitHub-hosted runner and drives it with k6: checkouts that write orders to PostgreSQL
# through Kafka, then an arrival-rate ramp on the catalog that reads from PostgreSQL.
# Answers whether the runner can hold the whole stack, and gives the base numbers the
# load fixtures (O1, O5) are compared against. On a branch, services whose src/ changed
# against main are rebuilt from source, so a fixture branch runs its own code.

on:
  workflow_dispatch:
    inputs:
      checkout_rate:
        description: k6 checkouts per second
        default: "3"
      checkout_duration:
        description: k6 checkout run time
        default: 2m
      catalog_rates:
        description: k6 catalog arrival rates per second, one stage each
        default: "20,50,100,200"
      catalog_stage:
        description: Seconds held at each catalog rate
        default: "60"
      lock_contention:
        description: Turn on productCatalogLockContention (positive control)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/stack-smoke.yml
      - test/load/**

permissions:
  contents: read

env:
  COMPOSE: >-
    docker compose --env-file .env --env-file .env.override
    -f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.extras.yaml
  LOCUST_AUTOSTART: "false"
  CHECKOUT_RATE: ${{ inputs.checkout_rate || '3' }}
  CHECKOUT_DURATION: ${{ inputs.checkout_duration || '2m' }}
  RATES: ${{ inputs.catalog_rates || '20,50,100,200' }}
  STAGE: ${{ inputs.catalog_stage || '60' }}
  RAMP: "10"
  K6: grafana/k6:1.3.0

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null

      - name: Runner resources
        run: |
          nproc; free -h; df -h /; docker version --format '{{.Server.Version}}'

      - name: Pull images
        run: |
          start=$(date +%s)
          $COMPOSE pull --quiet
          echo "pull took $(( $(date +%s) - start ))s"
          docker system df

      - name: Build services changed against main
        run: |
          changed=$(git diff --name-only origin/main...HEAD | awk -F/ '$1=="src"{print $2}' | sort -u \
            | grep -xF -f <($COMPOSE config --services) || true)
          if [[ -z $changed ]]; then echo "no service changed, running the published images"; exit 0; fi
          echo "building from source: $changed"
          $COMPOSE build $changed

      - name: Turn on productCatalogLockContention
        if: inputs.lock_contention
        run: |
          f=src/flagd/demo.flagd.json
          jq '.flags.productCatalogLockContention.defaultVariant = "on"' $f > $f.new && mv $f.new $f

      - name: Start all services
        run: $COMPOSE up -d --no-build --force-recreate --remove-orphans

      - name: Wait for storefront and services
        run: |
          deadline=$(( $(date +%s) + 600 ))
          until curl -sf http://localhost:8080/api/products >/dev/null; do
            if (( $(date +%s) >= deadline )); then echo "storefront not ready after 600s"; $COMPOSE ps -a; exit 1; fi
            sleep 5
          done
          echo "storefront ready after $(( $(date +%s) - deadline + 600 ))s"
          # Give the Kafka consumers time to join before orders arrive.
          sleep 30
          $COMPOSE ps -a --format 'table {{.Service}}\t{{.State}}\t{{.Status}}'

      - name: k6 checkouts write orders to PostgreSQL
        run: |
          psql() { docker exec astronomy-db psql -U postgres -d astronomy_db -tAc "$1"; }
          before=$(psql 'SELECT count(*) FROM accounting."order"')
          rc=0
          docker run --rm -u "$(id -u):$(id -g)" --network opentelemetry-demo -v "$PWD/test/load:/load" -v "$PWD:/out" \
            -e RATE="$CHECKOUT_RATE" -e DURATION="$CHECKOUT_DURATION" \
            $K6 run -q --summary-export /out/k6-checkout.json /load/checkout.js > k6-checkout.log 2>&1 || rc=$?
          tail -5 k6-checkout.log
          placed=$(jq '.metrics.checkout_succeeded.passes' k6-checkout.json)
          # accounting consumes the orders topic asynchronously.
          for i in $(seq 1 24); do
            written=$(( $(psql 'SELECT count(*) FROM accounting."order"') - before ))
            (( written >= placed )) && break
            sleep 5
          done
          echo "orderitems total: $(psql 'SELECT count(*) FROM accounting.orderitem')"
          python3 test/load/report.py checkout k6-checkout.json "$written"
          exit $rc

      - name: k6 catalog ramp reads from PostgreSQL
        run: |
          psql() { docker exec astronomy-db psql -U postgres -d astronomy_db -tAc "$1"; }
          sql="SELECT coalesce(sum(calls),0) FROM pg_stat_statements WHERE query ILIKE '%catalog.products%'"
          # Warm-up, not recorded.
          docker run --rm -i --network opentelemetry-demo $K6 run -q --vus 5 --duration 30s - >/dev/null 2>&1 <<'JS'
          import http from "k6/http";
          export default function () { http.get("http://frontend-proxy:8080/api/products/OLJCESPC7Z?currencyCode=USD"); }
          JS
          sleep 20  # let a metric export land before the start mark
          queries_before=$(psql "$sql")
          start=$(date +%s)
          stages=$(( $(tr -cd , <<<"$RATES" | wc -c) + 1 ))
          docker run --rm -u "$(id -u):$(id -g)" --network opentelemetry-demo -v "$PWD/test/load:/load" -v "$PWD:/out" \
            -e RATES -e STAGE -e RAMP \
            $K6 run -q --summary-export /out/k6-catalog.json /load/catalog-arrival.js > k6-catalog.log 2>&1 &
          pid=$!
          sleep $(( stages * (STAGE + RAMP) - STAGE / 2 ))
          echo "docker stats in the last stage:"
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
          uptime
          rc=0; wait $pid || rc=$?
          sleep 25  # last metric export
          end=$(date +%s)
          tail -5 k6-catalog.log
          echo "catalog.products queries during the ramp: $(( $(psql "$sql") - queries_before ))"
          python3 test/load/report.py catalog k6-catalog.json http://localhost:9090 "$start" "$end"
          exit $rc

      - name: Check containers stayed up
        if: always()
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'
          free -h
          bad=$(docker ps -a --filter label=com.docker.compose.project --format '{{.Names}}' | while read -r c; do
            read -r state restarts oom <<<"$(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.OOMKilled}}' "$c")"
            if [[ $state != running || $restarts != 0 || $oom != false ]]; then echo "$c state=$state restarts=$restarts oom=$oom"; fi
          done)
          echo "${bad:-all containers running, no restarts, no OOM kills}"
          [[ -z $bad ]]

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200 > compose.log; tail -c 200000 compose.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-smoke
          path: |
            compose.log
            k6-*.log
            k6-*.json
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: $COMPOSE down --volumes --remove-orphans
