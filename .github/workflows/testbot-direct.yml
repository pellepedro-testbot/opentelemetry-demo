# Runs Testbot on one PR from GitHub, without the Skyramp web app, on the rachzucco VM runner.
# Use it to reproduce and debug Testbot issues; its results are not F1 evidence.
name: Testbot direct
run-name: "Testbot direct · PR #${{ inputs.pr }}${{ inputs.testbot_ref && format(' · testbot {0}', inputs.testbot_ref) || '' }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to validate
        required: true
      testbot_ref:
        description: Patched Testbot build to run, a folder name under /opt/testbot on the VM (blank = the released skyramp/testbot@v1)
        required: false
        default: ''
      model:
        description: Claude model alias
        required: false
        default: opus
      enable_debug:
        description: Testbot debug logging
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: testbot-direct-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  testbot:
    runs-on: [self-hosted, rachzucco]
    timeout-minutes: 390
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Run Skyramp Testbot (released)
        if: inputs.testbot_ref == ''
        uses: skyramp/testbot@v1
        with:
          pipeline: staged
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE }}
          anthropicApiKey: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          enableDebug: ${{ inputs.enable_debug }}
          postPrComment: 'false'
          testbotTimeout: '360'
          targetSetupCommand: LOCUST_AUTOSTART=false docker compose --env-file .env --env-file .env.override -f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.extras.yaml up -d --build
          targetReadyCheckCommand: curl -fsS http://localhost:8080/api/products >/dev/null
          targetTeardownCommand: docker compose --env-file .env --env-file .env.override -f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.extras.yaml down -v --remove-orphans

      - name: Use the patched Testbot build
        if: inputs.testbot_ref != ''
        env:
          REF: ${{ inputs.testbot_ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad testbot_ref"; exit 1; }
          test -f "/opt/testbot/$REF/action.yml" || { echo "::error::no build at /opt/testbot/$REF"; exit 1; }
          rm -rf .testbot-local && cp -R "/opt/testbot/$REF" .testbot-local
          # Kept out of git status, so Testbot's own file checks never see it.
          echo ".testbot-local/" >> .git/info/exclude

      - name: Run Skyramp Testbot (patched)
        if: inputs.testbot_ref != ''
        uses: ./.testbot-local
        with:
          pipeline: staged
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE }}
          anthropicApiKey: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ inputs.model }}
          enableDebug: ${{ inputs.enable_debug }}
          postPrComment: 'false'
          testbotTimeout: '360'
          targetSetupCommand: LOCUST_AUTOSTART=false docker compose --env-file .env --env-file .env.override -f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.extras.yaml up -d --build
          targetReadyCheckCommand: curl -fsS http://localhost:8080/api/products >/dev/null
          targetTeardownCommand: docker compose --env-file .env --env-file .env.override -f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.extras.yaml down -v --remove-orphans

